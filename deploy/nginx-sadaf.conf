# SADAF Clinic — denta.tw1.ru + sadaf.denta.tw1.ru
# Проксирует на gunicorn (127.0.0.1:8021). Статику/медиа отдаёт whitenoise через сам Django,
# но static и media также раздаются nginx напрямую для скорости.
# HTTPS-блок добавляет certbot автоматически (--nginx).

upstream sadaf_app {
    server 127.0.0.1:8021;
}

# Compression. text/html сжимается всегда при gzip on и в списке типов
# указываться не должен. gzip_proxied any обязателен: HTML приходит от gunicorn
# через proxy_pass, а по умолчанию проксированные ответы не сжимаются.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/css
    text/javascript
    text/plain
    application/javascript
    application/json
    application/xml
    image/svg+xml;

server {
    listen 80;
    listen [::]:80;
    server_name denta.tw1.ru sadaf.denta.tw1.ru;

    client_max_body_size 25M;

    location /static/ {
        alias /var/www/sadaf/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /var/www/sadaf/media/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://sadaf_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}

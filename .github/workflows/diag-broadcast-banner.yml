name: Diag — broadcast banner reappearing after keepalive fix (read-only)

# Пользователь сообщил, что баннер-объявление появляется снова даже если
# подождать 5-10 секунд перед переходом на другую страницу — значит дело
# НЕ в оборванном keepalive-запросе (PR #152 это не исправило до конца).
# Смотрим: (1) реальное состояние is_read у последних Broadcast-уведомлений
# в БД — совпадает ли Notification.clinic с clinic получателя (подозрение
# на фильтр по клинике в apps.notifications.views.mark_read через
# _user_notifications), (2) логи gunicorn/nginx на ошибки по
# /notifications/*/read/ (403 CSRF, 500 и т.п.). Read-only.
on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: SSH — состояние is_read по последним рассылкам (Django shell, read-only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            cd /var/www/sadaf
            set -a; . ./.env; set +a
            echo '' | base64 -d | ./venv/bin/python manage.py shell
            echo
            echo ">>> journalctl sadaf.service — ошибки по /notifications/ за последний час"
            sudo journalctl -u sadaf.service --since "1 hour ago" --no-pager | grep -i "notifications" | tail -80 || echo "(ничего не найдено)"
            echo
            echo ">>> nginx access.log — POST /notifications/*/read/ за сегодня"
            (sudo grep -h "read/" /var/log/nginx/access.log 2>/dev/null | grep "POST" | tail -50) || echo "(лог не найден или пуст)"

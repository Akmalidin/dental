name: Diag weak passwords

# Только чтение: сколько АКТИВНЫХ сотрудников в каждой клинике входят с
# простым паролем (1111, 123456 и т.п.). В лог — только числа по клиникам,
# без логинов и имён (репозиторий публичный).
on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          command_timeout: 10m
          script: |
            cd /var/www/sadaf
            set -a; . ./.env; set +a
            ./venv/bin/python manage.py shell -c "
            from collections import Counter
            from apps.users.models import User
            WEAK = ['1111', '123456', '1234', '0000', '12345678']
            per, total, flagged = Counter(), 0, 0
            for u in User.objects.filter(is_active=True).select_related('clinic'):
                total += 1
                if any(u.check_password(p) for p in WEAK):
                    per[u.clinic.slug if u.clinic_id else '-'] += 1
                    flagged += 1
            print('active users:', total, '| weak passwords:', flagged)
            for slug, n in sorted(per.items()):
                print('  clinic', slug, ':', n)
            "

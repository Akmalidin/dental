name: Server status check

# Ручной диагностический прогон (workflow_dispatch) — read-only проверка,
# ничего не деплоит и не перезапускает. Использует те же SSH-секреты, что и
# deploy.yml, потому что доступа к серверу с этой стороны иначе нет.
on:
  workflow_dispatch: {}

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - name: SSH status check (systemctl + journalctl + локальный curl)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            echo ">>> systemctl status sadaf.service"
            systemctl status sadaf.service --no-pager -l || true
            echo
            echo ">>> journalctl -u sadaf.service (последние 100 строк)"
            journalctl -u sadaf.service -n 100 --no-pager || true
            echo
            echo ">>> nginx: активен ли"
            systemctl is-active nginx || true
            echo
            echo ">>> локальный curl (мимо nginx, прямо в gunicorn — порт из его же лога 'Listening at')"
            GPORT=$(journalctl -u sadaf.service -n 300 --no-pager | grep -oP 'Listening at: http://127\.0\.0\.1:\K[0-9]+' | tail -1)
            GPORT=${GPORT:-8000}
            curl -s -o /dev/null -w "localhost:$GPORT HTTP %{http_code}\n" --max-time 5 "http://127.0.0.1:$GPORT/" || echo "curl 127.0.0.1:$GPORT не удался"
            echo
            echo ">>> история перезагрузок (не было ли автоматического reboot — unattended-upgrades с Automatic-Reboot)"
            who -b || true
            uptime -s || true
            last reboot -F | head -10 || true
            echo
            echo ">>> настройка автообновлений/автоперезагрузки"
            cat /etc/apt/apt.conf.d/20auto-upgrades 2>/dev/null || echo "20auto-upgrades не найден"
            grep -E "Automatic-Reboot|Unattended-Upgrade::Automatic-Reboot" /etc/apt/apt.conf.d/50unattended-upgrades 2>/dev/null || echo "не найдено в 50unattended-upgrades"
            echo
            echo ">>> хвост лога unattended-upgrades (последние 40 строк — тут видно, было ли scheduled reboot)"
            tail -n 40 /var/log/unattended-upgrades/unattended-upgrades.log 2>/dev/null || echo "лога нет"
            echo
            echo ">>> cron: периодические команды (wa_reminders, backup_database)"
            for u in root www-data $(whoami); do echo "--- crontab -u $u"; crontab -l -u "$u" 2>/dev/null | grep -v '^#' || echo "(пусто/нет доступа)"; done
            ls /etc/cron.d 2>/dev/null && grep -rh "manage.py" /etc/cron.d 2>/dev/null || true
            systemctl list-timers --all --no-pager 2>/dev/null | grep -iE "sadaf|remind|django" || echo "systemd-таймеров приложения нет"
            echo
            echo ">>> место на диске"
            df -h / || true
            echo
            echo ">>> память"
            free -h || true
            echo
            echo ">>> dmesg — сетевые события/OOM за последние сутки (если ядро логирует)"
            dmesg -T 2>/dev/null | tail -30 || echo "dmesg недоступен без sudo"
            echo
            echo ">>> ufw (локальный файрвол ОС)"
            ufw status verbose 2>/dev/null || echo "ufw не установлен/не запущен"
            echo
            echo ">>> iptables — правила с ограничением скорости на 22 порт (limit/recent/hashlimit)"
            iptables -L -n --line-numbers 2>/dev/null | grep -iE "22|limit|recent|hashlimit|dpt:ssh" || echo "iptables пуст или недоступен без sudo"
            echo
            echo ">>> fail2ban — не забанен ли диапазон (или сам сервис не штормит)"
            (systemctl is-active fail2ban 2>/dev/null && fail2ban-client status sshd 2>/dev/null) || echo "fail2ban не установлен/не активен"
            echo
            echo ">>> sshd: слушает ли, сколько сейчас соединений/попыток"
            ss -tn state established '( dport = :22 or sport = :22 )' 2>/dev/null || echo "ss недоступен"
            grep -E "^MaxStartups|^MaxSessions" /etc/ssh/sshd_config 2>/dev/null || echo "MaxStartups/MaxSessions не заданы явно (дефолт)"
            echo
            echo ">>> лог auth за последние ~5 минут — попытки/обрывы SSH-подключений"
            journalctl -u ssh -u sshd --since "-10 min" --no-pager 2>/dev/null | tail -60 || echo "нет юнита ssh/sshd в journalctl"
            echo
            echo ">>> что лежит на сервере: /var/www"
            ls -la /var/www/ 2>/dev/null || echo "/var/www недоступен"
            echo
            echo ">>> размер каждого проекта в /var/www"
            du -sh /var/www/*/ 2>/dev/null || true
            echo
            echo ">>> активные systemd-юниты приложений (свои сервисы, не системные)"
            systemctl list-units --type=service --state=running --no-pager --no-legend 2>/dev/null | grep -viE "systemd-|dbus|cron\.service|ssh\.service|networkd|resolved|udev|polkit|rsyslog|multipathd|snapd|unattended|apport|packagekit|accounts-daemon|logind" || true
            echo
            echo ">>> nginx: какие сайты включены (sites-enabled)"
            ls -la /etc/nginx/sites-enabled/ 2>/dev/null || echo "sites-enabled не найден"
            echo
            echo ">>> nginx: server_name из каждого конфига в sites-enabled"
            grep -RH "server_name" /etc/nginx/sites-enabled/ 2>/dev/null || true

name: Deploy to server

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

# Один деплой за раз: следующий ждёт окончания предыдущего, а не идёт параллельно.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Безопасный деплой (проверка → бэкап → миграции → плавный перезапуск → проверка → откат при сбое)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          command_timeout: 15m
          # Скрипт берём прямо из origin/main, а не из рабочей папки сервера:
          # иначе выполнялась бы прошлая версия update.sh (её читают до
          # обновления кода), и изменения деплоя действовали бы со следующего раза.
          script: |
            set -e
            cd /var/www/sadaf
            git fetch -q origin main
            git show origin/main:deploy/update.sh > /tmp/sadaf_update.sh
            bash /tmp/sadaf_update.sh

      - name: Проверка снаружи (https)
        run: |
          for i in 1 2 3 4 5 6; do
            body=$(curl -s --max-time 10 https://app.sadaf.kg/healthz/ || true)
            echo "healthz: ${body:-нет ответа}"
            echo "$body" | grep -q '"ok": true' && exit 0
            sleep 10
          done
          echo "Сайт снаружи не отвечает на /healthz/"
          exit 1

      - name: Сообщить о проваленном деплое
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `🔴 Деплой не прошёл: ${context.sha.slice(0, 7)}`,
              body: `Деплой коммита ${context.sha} завершился ошибкой.\n\n` +
                    `Если новая версия не ответила на проверку — код уже автоматически откатан на прежнюю версию ` +
                    `(подробности и команда восстановления базы, если нужна, — в логе).\n\nЛог: ${run}`,
            });

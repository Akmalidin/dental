name: Clinic staff — export logins (optionally reset passwords to 1111)

# Разовая задача по запросу владельца: выгрузить логины сотрудников одной
# клиники в CSV (для передачи руководству клиники). По умолчанию только
# список, ничего не меняет. apply=yes — ещё и ставит пароль 1111 всем
# АКТИВНЫМ сотрудникам клиники (кроме суперадминов). CSV кладётся
# артефактом прогона (хранится 1 день) и копией в base64 в лог — логи
# прогона после получения файла нужно удалить.
on:
  workflow_dispatch:
    inputs:
      clinic_slug:
        description: "Slug клиники (поддомен), например khalilov"
        required: true
        default: "khalilov"
      apply:
        description: "yes — поставить пароль 1111 активным сотрудникам; no — только список"
        required: true
        default: "no"
        type: choice
        options: ["no", "yes"]

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Выгрузить сотрудников (и при apply=yes — сбросить пароли)
        env:
          SLUG: ${{ inputs.clinic_slug }}
          APPLY: ${{ inputs.apply }}
        run: |
          set -o pipefail
          sudo apt-get install -y sshpass >/dev/null 2>&1
          case "$SLUG" in (*[!a-z0-9-]*|'') echo "bad slug"; exit 1;; esac
          sshpass -p "${{ secrets.DEPLOY_PASSWORD }}" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd /var/www/sadaf && set -a && . ./.env && set +a && echo '' | base64 -d | CLINIC_SLUG=$SLUG APPLY=$APPLY ./venv/bin/python manage.py shell" \
            > staff.csv
          echo "Строк в файле: $(wc -l < staff.csv)"
          # Копия в лог (base64) — чтобы файл можно было забрать и там, где
          # скачивание артефактов недоступно; логи прогона удалять после.
          echo "STAFF_CSV_B64_BEGIN"; base64 -w0 staff.csv; echo; echo "STAFF_CSV_B64_END"

      - uses: actions/upload-artifact@v4
        with:
          name: clinic-staff-${{ inputs.clinic_slug }}
          path: staff.csv
          retention-days: 1

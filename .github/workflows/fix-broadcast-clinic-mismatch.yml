name: Fix — correct clinic_id on already-sent broadcast notifications

# Одноразовая правка данных, следствие бага (см. PR #155): рассылки,
# отправленные ДО фикса, получали notification.clinic_id = клиника, на
# которой суперадмин "сидел" в момент отправки (session["active_clinic"]
# или поддомен), а не собственную клинику получателя — из-за этого крестик
# на баннере слал POST .../read/ с кодом 200, но is_read не проставлялся
# (mark_read фильтрует по клинике получателя, строка не находилась), и
# баннер появлялся снова на следующей странице.
#
# Правит clinic_id на уже отправленных Notification(type="broadcast") так,
# чтобы совпадала с user.clinic_id получателя — is_read НЕ трогает, только
# делает поле внутренне согласованным, чтобы обычный mark_read наконец
# сработал. Печатает состояние ДО и ПОСЛЕ для аудита.
on:
  workflow_dispatch: {}

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: SSH — скорректировать clinic_id у несовпадающих broadcast-уведомлений
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            cd /var/www/sadaf
            set -a; . ./.env; set +a
            echo '' | base64 -d | ./venv/bin/python manage.py shell

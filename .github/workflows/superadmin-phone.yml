name: Superadmin phone (Telegram /admin)

# Суперадмин подтверждает себя в Telegram-боте клиники командой /admin —
# бот сверяет номер с User.phone суперадмина. Этот прогон показывает
# суперадминов, заполнен ли у них телефон и совпадает ли он с PHONE
# (печатаются только последние 4 цифры). set_login — записать PHONE в
# телефон суперадмина с этим логином (только суперадмину).
on:
  workflow_dispatch:
    inputs:
      phone:
        description: "Номер для сверки, например 996XXXXXXXXX"
        required: true
      set_login:
        description: "Логин суперадмина, которому записать этот номер (пусто — только проверить)"
        required: false
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Проверить/записать телефон суперадмина
        env:
          PHONE: ${{ inputs.phone }}
          SET_LOGIN: ${{ inputs.set_login }}
        run: |
          case "$PHONE" in (*[!0-9+]*|'') echo "bad phone"; exit 1;; esac
          case "$SET_LOGIN" in (*[!A-Za-z0-9_.@-]*) echo "bad login"; exit 1;; esac
          sudo apt-get install -y sshpass >/dev/null 2>&1
          sshpass -p "${{ secrets.DEPLOY_PASSWORD }}" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd /var/www/sadaf && set -a && . ./.env && set +a && echo '' | base64 -d | PHONE=$PHONE SET_LOGIN=$SET_LOGIN ./venv/bin/python manage.py shell"

name: Diag — patients vs appointments/treatments by branch (read-only)

# Расследование по скриншотам пользователя (21/22.09.2026, клиника khalilov):
# после перехода на "пациент общий для клиники" (PR #139, фильтр "по
# филиалу" теперь смотрит на Appointment.branch/Treatment.branch, а не
# Patient.branch) числа по филиалам перестали быть аддитивными
# (167+346 != 3209) — подозрение, что у большинства пациентов в базе вообще
# нет ни одного приёма/лечения. Read-only, ничего не меняет.
on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: SSH — сравнение Patient/Appointment/Treatment по филиалам (Django shell, read-only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            cd /var/www/sadaf
            set -a; . ./.env; set +a
            echo '' | base64 -d | ./venv/bin/python manage.py shell

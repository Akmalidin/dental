name: Spam senders check (read-only, no changes)

# Диагностика источника .apk-спама в chat_media (инциденты 2026-09-18/19).
# Green-API — просто мост к реальному WhatsApp: вебхук documentMessage
# срабатывает только на настоящие входящие сообщения, значит файлы шлют
# реальные (скорее всего скомпрометированные/спам-боты) номера прямо на
# WhatsApp-номер клиники, а не через уязвимость в приложении. Смотрим,
# сколько разных номеров это делают и как часто — чтобы решить, нужна ли
# ещё и блокировка по отправителю поверх уже исправленного блок-листа по
# типу файла (PR #129/#133). Скрипт закодирован в base64 одной строкой,
# чтобы не ловить конфликт отступов YAML-блока с отступами Python.
on:
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: SSH — разбор отправителей по WaMessage (Django shell, read-only)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            cd /var/www/sadaf
            set -a; . ./.env; set +a
            echo '' | base64 -d | ./venv/bin/python manage.py shell

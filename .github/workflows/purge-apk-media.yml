name: Purge .apk from chat_media (emergency — confirmed by user)

# Разбор media-breakdown.yml показал: 691 файл .apk (по 50-68MB каждый) в
# /var/www/sadaf/media/chat_media — это не переписка с пациентами, это
# спам/подозрительные вложения через WhatsApp/Telegram-вебхук (никакого
# делового смысла хранить .apk с клинического номера нет). Именно они дали
# 387 файлов / 6.5GB только за последние 24 часа и стали прямой причиной
# третьего подряд падения диска 2026-09-18. Пользователь явно подтвердил
# удаление после третьего простоя ("опять упал - удали").
on:
  workflow_dispatch: {}

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: SSH — удалить .apk из chat_media, проверить сайт
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            echo ">>> ДО: df -h /"
            df -h /
            echo

            echo ">>> сколько .apk и суммарный размер"
            find /var/www/sadaf/media/chat_media -type f -iname '*.apk' -printf '%s\n' 2>/dev/null | awk '{sum+=$1; n++} END {printf "%d файлов, %.1fM\n", n, sum/1048576}'
            echo

            echo "=== УДАЛЯЕМ ==="
            find /var/www/sadaf/media/chat_media -type f -iname '*.apk' -delete
            echo "удалено"
            echo

            echo ">>> ПОСЛЕ: df -h /"
            df -h /
            echo

            echo ">>> PostgreSQL"
            systemctl is-active postgresql@16-main || true
            sleep 3
            sudo -u postgres psql -tAc "SELECT pg_is_in_recovery();" 2>&1 || true
            echo

            echo ">>> curl"
            GPORT=$(journalctl -u sadaf.service -n 300 --no-pager 2>/dev/null | grep -oP 'Listening at: http://127\.0\.0\.1:\K[0-9]+' | tail -1)
            GPORT=${GPORT:-8021}
            curl -s -o /dev/null -w "localhost:$GPORT HTTP %{http_code}\n" --max-time 10 "http://127.0.0.1:$GPORT/" || echo "curl не удался"
            curl -s -o /dev/null -w "код: %{http_code}\n" --max-time 10 "http://127.0.0.1:$GPORT/" | grep -qE ' (2|3)[0-9][0-9]$' || {
              echo "перезапускаю sadaf.service"
              systemctl restart sadaf.service
              sleep 3
              curl -s -o /dev/null -w "localhost:$GPORT HTTP %{http_code} (после restart)\n" --max-time 10 "http://127.0.0.1:$GPORT/" || echo "curl всё ещё не удался"
            }

name: Diag patient AI

# Только чтение: почему ИИ-ассистент не ответил пациенту — настройки клиник,
# последние входящие сообщения и их статус, журнал и cron.
on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          script: |
            cd /var/www/sadaf
            echo ">>> crontab www-data"
            crontab -l -u www-data 2>/dev/null | grep -o "patient_assistant_tick.*" | head -2
            echo ">>> cron в syslog за 15 минут"
            journalctl -u cron --since "-15 min" --no-pager 2>/dev/null | grep -c patient_assistant || true
            echo ">>> backups/patient_ai.log"
            tail -n 20 backups/patient_ai.log 2>/dev/null || echo "(нет лога)"
            set -a; . ./.env; set +a
            export DJANGO_SETTINGS_MODULE=config.settings.server
            ./venv/bin/python manage.py shell <<'PY'
            from datetime import timedelta
            from django.utils import timezone
            from apps.settings_clinic.models import ClinicSettings
            from apps.notifications.models import WaMessage, ChatBotState
            from apps.notifications.assistant import openai_enabled
            print("openai_enabled:", openai_enabled())
            for cs in ClinicSettings.objects.exclude(clinic=None):
                print("clinic", cs.clinic_id, cs.name, "| bot:", cs.ai_patient_bot, "| delay:", cs.ai_patient_delay_min,
                      "| since:", cs.ai_patient_since, "| inst:", cs.wa_id_instance or "-")
            since = timezone.now() - timedelta(hours=4)
            for m in WaMessage.all_clinics.filter(created_at__gte=since).order_by("created_at")[:40]:
                print("msg", m.pk, m.created_at.strftime("%H:%M:%S"), "clinic=%s" % m.clinic_id, m.channel, m.direction,
                      "phone=..%s" % (m.phone or "")[-4:], "patient=%s" % m.patient_id, "ai=%r" % m.ai_status,
                      "by_ai=%s" % m.by_ai, "sent_by=%s" % m.sent_by_id, (m.body or "")[:40].replace("\n", " "))
            print("paused:", list(ChatBotState.all_clinics.filter(paused=True).values_list("clinic_id", "channel", "address", "reason")))
            print("now:", timezone.now())
            PY

{% extends "newui/base.html" %}
{% block page_title %}Профиль{% endblock %}
{% block content %}
      <div class="topbar"><h1 data-i18n="nav_профиль">Профиль</h1></div>
      <div class="page">
        <div style="display:grid;grid-template-columns:280px 1fr;gap:16px;align-items:start;">
          <div style="display:flex;flex-direction:column;gap:14px;">

            <!-- Аватар -->
            <div class="card" style="padding:22px;text-align:center;">
              <div style="position:relative;display:inline-block;margin-bottom:12px;">
                <div id="pf-avatar-wrap" style="width:84px;height:84px;border-radius:50%;overflow:hidden;margin:0 auto;"></div>
                <label for="pf-avatar-input" style="position:absolute;bottom:-2px;right:-2px;width:28px;height:28px;border-radius:50%;background:var(--cobalt);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2);">
                  <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" style="width:14px;height:14px;"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
                </label>
                <input type="file" id="pf-avatar-input" accept="image/*" style="display:none;" onchange="submitProfileAvatar()">
              </div>
              <div id="pf-name-display" style="font-weight:700;font-size:14.5px;">—</div>
              <span id="pf-role-display" class="pill cobalt" style="margin-top:6px;display:inline-block;">—</span>
            </div>

            <!-- WhatsApp -->
            <div class="card" style="padding:16px;">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                <span style="font-weight:600;font-size:13px;">WhatsApp</span>
                <button class="btn btn-sm" style="background:#25D366;color:#fff;border:none;" type="button" onclick="submitProfileWhatsApp()"><span data-i18n="w_save">Сохранить</span></button>
              </div>
              <input autocomplete="off" readonly onfocus="this.removeAttribute('readonly')" type="tel" id="pf-phone" placeholder="+996 700 000 000" style="width:100%;">
              <div class="hint" style="margin-top:8px;" data-i18n="w_whatsapp_hint">Укажите номер для получения сообщений и отчётов</div>
            </div>

            <!-- Google Calendar -->
            <div class="card" style="padding:16px;">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                <span style="font-weight:600;font-size:13px;" data-i18n="w_gcal">Google Календарь</span>
                <span id="pf-gcal-action"></span>
              </div>
              <div id="pf-gcal-status" class="hint"></div>
            </div>

            <!-- Ежедневный отчёт -->
            <div class="card" style="padding:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;">
              <div>
                <div style="font-weight:600;font-size:13px;" data-i18n="w_daily_report">Ежедневный отчёт</div>
                <div class="hint" data-i18n="w_daily_report_hint">Придёт в WhatsApp</div>
              </div>
              <button class="btn btn-cobalt btn-sm" type="button" onclick="sendProfileDailyReport()"><span data-i18n="w_send">Отправить</span></button>
            </div>
          </div>

          <div class="card">
            <div class="card-head"><h3 data-i18n="w_edit_profile">Редактировать профиль</h3></div>
            <div class="card-body" style="padding:4px 18px;">
              <div class="field-row"><label data-i18n="w_fullname">ФИО</label><input autocomplete="off" readonly onfocus="this.removeAttribute('readonly')" type="text" id="pf-name"></div>
              <div class="field-row"><label data-i18n="w_login">Логин</label><input autocomplete="off" readonly onfocus="this.removeAttribute('readonly')" type="text" id="pf-login"></div>
              <div class="field-row"><label><span data-i18n="w_new_password">Новый пароль</span><div class="hint" data-i18n="w_password_blank_hint">Оставьте пустым, чтобы не менять</div></label><input autocomplete="new-password" type="password" id="pf-password" placeholder="••••••••"></div>
              <div class="field-row"><label data-i18n="w_confirm_password">Подтвердите пароль</label><input autocomplete="new-password" type="password" id="pf-password2" placeholder="••••••••"></div>
              <div id="pf-error" class="hidden" style="background:#FDECEC;color:#B42318;border-radius:8px;padding:10px 12px;font-size:13px;margin:10px 0;"></div>
              <div class="field-row" style="border-bottom:none;">
                <label></label>
                <button class="btn btn-primary" type="button" onclick="submitProfileMain()"><span data-i18n="w_save_changes">Сохранить изменения</span></button>
              </div>
            </div>
          </div>
        </div>
      </div>
{% endblock %}
{% block extra_js %}
<script>
(function(){
  const s = profileRealData;
  if(!s) return;

  function renderAvatar(){
    const wrap = document.getElementById('pf-avatar-wrap');
    wrap.innerHTML = s.avatarUrl
      ? `<img src="${s.avatarUrl}" style="width:100%;height:100%;object-fit:cover;">`
      : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--cobalt),#8B5CF6);">${(s.name||'?').charAt(0).toUpperCase()}</div>`;
  }
  renderAvatar();
  document.getElementById('pf-name-display').textContent = s.name;
  document.getElementById('pf-role-display').textContent = s.roleName || '—';
  document.getElementById('pf-phone').value = s.phone;
  document.getElementById('pf-name').value = s.name;
  document.getElementById('pf-login').value = s.login;

  const gcalAction = document.getElementById('pf-gcal-action');
  const gcalStatus = document.getElementById('pf-gcal-status');
  if(s.gcalConnected){
    gcalAction.innerHTML = `<button class="btn btn-ghost btn-sm" type="button" style="color:#ef4444;" onclick="disconnectProfileGcal()">${t('w_gcal_disconnect')}</button>`;
    gcalStatus.innerHTML = `✅ ${t('w_gcal_connected')}${s.gcalEmail ? ': <b>'+s.gcalEmail+'</b>' : ''}`;
  } else if(s.gcalEnabled){
    gcalAction.innerHTML = `<a class="btn btn-sm" style="background:#4285F4;color:#fff;" href="/google/calendar/connect/">${t('w_gcal_connect')}</a>`;
    gcalStatus.textContent = t('w_gcal_hint');
  } else {
    gcalAction.innerHTML = '';
    gcalStatus.textContent = t('w_gcal_not_configured');
  }

  window.submitProfileAvatar = async function(){
    const fileInput = document.getElementById('pf-avatar-input');
    if(!fileInput.files.length) return;
    const fd = new FormData();
    fd.append('_avatar_only', '1');
    fd.append('avatar', fileInput.files[0]);
    const res = await postForm('/profile/', fd);
    if(res.redirected){ flashAndReload(t('w_settings_saved')); }
    else { showToast(t('w_settings_save_failed'), 'error'); }
  };

  window.submitProfileWhatsApp = async function(){
    const fd = new FormData();
    fd.append('_whatsapp_only', '1');
    fd.append('phone', document.getElementById('pf-phone').value.trim());
    const res = await postForm('/profile/', fd);
    if(res.redirected){ flashAndReload(t('w_settings_saved')); }
    else { showToast(t('w_settings_save_failed'), 'error'); }
  };

  window.disconnectProfileGcal = async function(){
    if(!confirm(t('w_gcal_disconnect_confirm'))) return;
    const res = await postForm('/google/calendar/disconnect/', new FormData());
    if(res.redirected){ flashAndReload(t('w_settings_saved')); }
    else { showToast(t('w_settings_save_failed'), 'error'); }
  };

  window.sendProfileDailyReport = async function(){
    // profile_send_daily_report всегда делает redirect("profile") — и при
    // успехе, и при ошибке (нет номера/WhatsApp не настроен/сбой отправки) —
    // res.redirected тут не отличит исход, поэтому разбираем реальное
    // сообщение (messages framework) из тела ответа после редиректа.
    const res = await postForm('/profile/daily-report/', new FormData());
    const doc = new DOMParser().parseFromString(await res.text(), 'text/html');
    const errBlock = doc.querySelector('.badge-red');
    if(errBlock){ showToast(errBlock.textContent.trim().replace(/\s+/g,' '), 'error'); }
    else { showToast(t('w_daily_report_sent')); }
  };

  window.submitProfileMain = async function(){
    const name = document.getElementById('pf-name').value.trim();
    const login = document.getElementById('pf-login').value.trim();
    const password = document.getElementById('pf-password').value;
    const password2 = document.getElementById('pf-password2').value;
    const errEl = document.getElementById('pf-error');
    errEl.classList.add('hidden');
    if(!name || !login) return;
    if(password && password !== password2){
      errEl.textContent = t('w_passwords_mismatch');
      errEl.classList.remove('hidden');
      return;
    }
    const fd = new FormData();
    fd.append('name', name);
    fd.append('login', login);
    if(password){ fd.append('password', password); fd.append('password2', password2); }
    const res = await postForm('/profile/', fd);
    if(res.redirected){ flashAndReload(t('w_settings_saved')); }
    else {
      errEl.textContent = await extractFormError(res);
      errEl.classList.remove('hidden');
    }
  };
})();
</script>
{% endblock %}

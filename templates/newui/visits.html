{% extends "newui/base.html" %}
{% block page_title %}Визиты{% endblock %}
{% block content %}
      <div class="topbar"><h1 data-i18n="title_visits">Визиты</h1><div class="topbar-right"><div class="search-box"><input type="text" id="visitsSearchInput" placeholder="⌕ Пациент, врач…" data-i18n-placeholder="w_search_patient_doctor" oninput="renderVisits()" style="border:none;background:transparent;width:100%;outline:none;font-size:13px;"></div><button class="btn btn-cobalt" onclick="openNewAppt()">+ <span data-i18n="w_new_visit">Новый визит</span></button></div></div>
      <div class="page">
        <div class="toolbar"><div class="toolbar-left" id="visitsChips"></div></div>
        <div class="card">
          <table>
            <thead><tr><th data-i18n="w_date">Дата</th><th data-i18n="w_time">Время</th><th data-i18n="w_patient">Пациент</th><th data-i18n="w_doctor">Врач</th><th data-i18n="w_service">Услуга</th><th data-i18n="w_status">Статус</th><th></th></tr></thead>
            <tbody id="visitsTableBody"></tbody>
          </table>
        </div>
      </div>
{% endblock %}

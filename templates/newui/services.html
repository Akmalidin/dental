{% extends "newui/base.html" %}
{% block page_title %}Услуги{% endblock %}
{% block content %}
      <div class="topbar"><h1 data-i18n="title_services">Услуги и прайс-лист</h1><div class="topbar-right"><div class="search-box"><input type="text" id="svcSearchInput" placeholder="Название услуги…" oninput="renderServicesTable()" style="border:none;background:transparent;width:100%;outline:none;font-size:13px;"></div><button class="btn btn-cobalt" onclick="openNewService()">+ <span data-i18n="w_new_service">Новая услуга</span></button></div></div>
      <div class="page">
        <div class="toolbar"><div class="toolbar-left" id="svcCategoryChips"></div></div>
        <div class="card">
          <table>
            <thead><tr><th data-i18n="w_service">Услуга</th><th data-i18n="w_code">Код</th><th data-i18n="w_category">Категория</th><th data-i18n="w_price">Цена</th><th data-i18n="w_active_f">Активна</th><th></th></tr></thead>
            <tbody id="servicesTableBody"></tbody>
          </table>
        </div>
      </div>
{% endblock %}

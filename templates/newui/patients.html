{% extends "newui/base.html" %}
{% block page_title %}Пациенты{% endblock %}
{% block content %}
      <div class="topbar">
        <h1 data-i18n="title_patients">Пациенты</h1>
        <div class="topbar-right">
          <div class="search-box"><input autocomplete="off" readonly onfocus="this.removeAttribute('readonly')" type="text" id="patientSearchInput" placeholder="⌕ ФИО, телефон…" data-i18n-placeholder="w_search_fullname_phone" oninput="patientsSearchInput()" style="border:none;background:transparent;width:100%;outline:none;font-size:13px;"></div>
          <button class="btn btn-ghost" onclick="location.href='/new/blacklist/'" style="position:relative;">🚫 <span data-i18n="nav_черный_список">Чёрный список</span><span class="nav-badge" id="blacklistNavBadge" style="margin-left:6px;">0</span></button>
          <button class="btn btn-ghost hidden" id="patientsMergeExactBtn" onclick="openBulkMergeExact()">🔀 <span data-i18n="w_merge_exact_dupes">Слить все точные дубли</span></button>
          <button class="btn btn-cobalt" onclick="openNewPatient()">+ <span data-i18n="w_new_patient">Новый пациент</span></button>
        </div>
      </div>
      <div class="page">
        <div class="kpi-grid" id="patientsKpiRow"></div>
        <div class="toolbar" style="justify-content:space-between;">
          <div class="toolbar-left" id="patientChips"></div>
          <div style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft);">
            <span data-i18n="w_per_page">Показывать по</span>
            <select id="patientsPerPageSelect" onchange="patientsSetPerPage(this.value)" style="width:auto;padding:6px 8px;">
              <option value="25" selected>25</option>
              <option value="50">50</option>
              <option value="100">100</option>
              <option value="200">200</option>
            </select>
          </div>
        </div>
        <div class="card">
          <table>
            <thead><tr><th data-i18n="w_patient">Пациент</th><th data-i18n="w_phone">Телефон</th><th data-i18n="w_doctor">Врач</th><th data-i18n="w_last_visit">Посл. визит</th><th data-i18n="w_balance">Баланс</th><th data-i18n="w_status">Статус</th><th></th></tr></thead>
            <tbody id="patientsTableBody"></tbody>
          </table>
        </div>
        <div id="patientsPagination" style="display:flex;justify-content:space-between;align-items:center;margin-top:12px;"></div>
      </div>

      <!-- Проверка дубликата — «Есть в базе» у строки с телефоном, который
           встречается ещё у кого-то. Переносит функционал старой страницы
           /patients/ (⚠ Возможные дубли) в новый интерфейс: те же
           эндпоинты (/patients/<id>/merge/search|confirm/,
           /mark-not-duplicate/), без дублирования бизнес-логики. -->
      <div class="modal-backdrop" id="m-patient-merge">
        <div class="modal wide">
          <div class="modal-head"><h3 data-i18n="w_merge_check_title">Проверка дубликата</h3><button class="modal-close" onclick="closeModal('m-patient-merge')">✕</button></div>
          <div class="modal-body">
            <p style="font-size:12.5px;color:var(--ink-soft);margin:0 0 14px;" id="pmSubtitle"></p>
            <div id="pmCandidates"></div>
          </div>
          <div class="modal-foot">
            <button class="btn btn-ghost" onclick="closeModal('m-patient-merge')" data-i18n="w_close">Закрыть</button>
          </div>
        </div>
      </div>

      <!-- Авто-слияние точных дублей (телефон + ФИО совпадают) — тот же
           критерий, что уже используется при создании пациента для блокировки
           дубля, поэтому доверие к нему как безопасному уже есть в продукте.
           Пары с совпадением ТОЛЬКО по телефону сюда не попадают — для них
           остаётся ручной обзор через «⚠ Возможные дубли» выше. -->
      <div class="modal-backdrop" id="m-bulk-merge-exact">
        <div class="modal">
          <div class="modal-head"><h3 data-i18n="w_merge_exact_dupes">Слить все точные дубли</h3><button class="modal-close" onclick="closeModal('m-bulk-merge-exact')">✕</button></div>
          <div class="modal-body">
            <p style="font-size:13px;color:var(--ink-soft);" id="bmePreviewText">Загрузка…</p>
          </div>
          <div class="modal-foot">
            <button class="btn btn-ghost" onclick="closeModal('m-bulk-merge-exact')" data-i18n="w_cancel">Отмена</button>
            <button class="btn btn-cobalt" id="bmeSubmitBtn" onclick="submitBulkMergeExact()" disabled data-i18n="w_merge_now">Слить</button>
          </div>
        </div>
      </div>
{% endblock %}
